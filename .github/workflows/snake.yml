
name: Generate Purple Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Anastasia-ans
          outputs: |
            dist/github-snake.svg?color_snake=%237845AB&color_dots=%23241735,%23452C61,%237845AB,%23B99AE8,%23E8DDF8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C8A2F5

      - name: Publish snake animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
